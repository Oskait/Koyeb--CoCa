<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Concentration Calculator</title>
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <h1>Concentration Calculator</h1>

    <div class="container">
        <h2>Compound</h2>
        <div class="input-group">
            <label for="compound-select">Select Compound (or enter manually below)</label>
            <select id="compound-select">
                <option value="">-- New Compound --</option>
                {% for compound in compounds %}
                <option value="{{ compound.id }}"
                        data-mw="{{ compound.molecular_weight if compound.molecular_weight is not none else '' }}"
                        data-conc-mm="{{ compound.default_conc_mM if compound.default_conc_mM is not none else '' }}"
                        data-conc-mgml="{{ compound.default_conc_mg_ml if compound.default_conc_mg_ml is not none else '' }}"
                        data-vol="{{ compound.default_volume if compound.default_volume is not none else '' }}"
                        data-name="{{ compound.abbr_name }}">
                    {{ compound.abbr_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <h2>Calculator</h2>
        <div class="calculator">
            <div class="input-group">
                <label for="compound-name">Compound Name</label>
                <input type="text" id="compound-name">
            </div>
            <div class="input-group">
                <label for="molecular-weight">Molecular Weight (g/mol)</label>
                <input type="number" id="molecular-weight">
            </div>
            <div class="input-group">
                <label for="concentration">Concentration</label>
                <input type="number" id="concentration">
                <div class="toggle-switch">
                    <label class="switch">
                        <input type="checkbox" id="unit-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span id="unit-label">mM</span>
                </div>
            </div>
            <div class="input-group">
                <label for="volume">Desired Volume (ml)</label>
                <input type="number" id="volume">
            </div>
            <div class="output-group">
                <p>Weigh in: <span id="weigh-in-mass">0</span> mg (<span id="weigh-in-mass-g">0</span> g)</p>
            </div>
            <div class="input-group">
                <label for="actual-weigh-in">Actual Weigh-in (mg)</label>
                <input type="number" id="actual-weigh-in">
            </div>
            <div class="output-group">
                <p>Required Volume: <span id="required-volume">0</span> ml</p>
            </div>

            <div id="calculation-overview" class="output-group" style="display: none;">
                <p>Final solution: <span id="overview-name"></span>, <span id="overview-concentration"></span>, <span id="overview-volume"></span></p>
            </div>

            <button id="save-stock">Save Stock</button>
        </div>

        <div class="stock-solutions-container">
            <button id="toggle-stock-solutions">Toggle Saved Stock Solutions</button>
            <div id="stock-solutions-wrapper" style="display:none;">
                <h2>Saved Stock Solutions</h2>
                <table id="stock-solutions-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Compound</th>
                            <th>Concentration (mM)</th>
                            <th>Concentration (mg/ml)</th>
                            <th>Volume (ml)</th>
                            <th>Weighed in (mg)</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
